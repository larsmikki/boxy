services:
  collectr:
    image: larsmikki/collectr:latest
    container_name: collectr
    ports:
      - "3070:3070"
    volumes:
      - collectr-data:/app/data
    restart: always
    environment:
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3070/api/health"]
      interval: 300s
      timeout: 5s
      retries: 3

volumes:
  collectr-data:
